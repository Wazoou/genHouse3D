name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run --extra cpu ruff check .
      - run: uv run --extra cpu ruff format --check .
      # Tests never touch the network or a GPU: fixtures live in tests/fixtures/.
      - run: uv run --extra cpu pytest

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv pip install gradio==6.32.0
      - run: uv run --no-sync python .github/scripts/space_smoke.py
