# Dimensions of the 3D house, in metres. Read by housegen.geometry3d.

walls:
  height: 2.5              # floor-to-ceiling height
  exterior_thickness: 0.2  # built outwards from the outer room edges
  interior_thickness: 0.1  # centred on the shared room edges

floor:
  slab_thickness: 0.2      # slab under the footprint, top face at z = 0
  finish_thickness: 0.02   # coloured floor finish per room (0 disables it)

doors:
  width: 0.9
  entrance_width: 1.0
  height: 2.1
  panel_thickness: 0.04

balcony:
  railing_height: 1.0
  railing_thickness: 0.05

# Windows only go on outer walls. `count` is a [min, max] range drawn with the seed; a
# window narrower than `min_width` after fitting the wall is dropped.
windows:
  margin: 0.4              # clearance to wall ends, doors and other windows
  glass_thickness: 0.03
  rules:
    living:   {count: [1, 2], width: 2.2, sill: 0.1, height: 2.0, min_width: 1.2}
    dining:   {count: [1, 1], width: 1.6, sill: 0.9, height: 1.2, min_width: 0.8}
    kitchen:  {count: [1, 1], width: 1.2, sill: 1.0, height: 1.1, min_width: 0.6}
    bedroom:  {count: [1, 2], width: 1.2, sill: 0.9, height: 1.2, min_width: 0.6}
    bathroom: {count: [1, 1], width: 0.6, sill: 1.5, height: 0.6, min_width: 0.4}
    # corridor, storage: no window

roof:
  type: hip                # hip | gable | flat | none
  pitch_deg: 30.0          # allowed range: 25 to 45
  overhang: 0.3
  fascia: 0.15             # vertical edge of the roof at the eaves
  quantum: 0.1             # the footprint is snapped to this grid before the skeleton
  gable_min_fill: 0.85     # gable only if footprint area / bounding box area >= this
  gable_thickness: 0.15
  flat_thickness: 0.25
  parapet_height: 0.4
  parapet_thickness: 0.2

# RGBA colours, 0 to 1. No textures.
materials:
  walls:    [0.93, 0.91, 0.86, 1.0]   # light render
  slab:     [0.62, 0.62, 0.60, 1.0]
  roof:     [0.66, 0.33, 0.25, 1.0]   # clay tiles
  roof_flat: [0.45, 0.46, 0.48, 1.0]
  doors:    [0.45, 0.31, 0.22, 1.0]
  glass:    [0.62, 0.80, 0.90, 0.45]
  railings: [0.30, 0.31, 0.33, 1.0]
  floors:
    living:   [0.80, 0.66, 0.47, 1.0]
    kitchen:  [0.78, 0.74, 0.68, 1.0]
    dining:   [0.80, 0.66, 0.47, 1.0]
    bedroom:  [0.74, 0.60, 0.44, 1.0]
    bathroom: [0.70, 0.80, 0.82, 1.0]
    corridor: [0.76, 0.70, 0.60, 1.0]
    storage:  [0.68, 0.66, 0.62, 1.0]
    balcony:  [0.72, 0.72, 0.70, 1.0]
