[project]
name = "housegen"
version = "0.1.0"
description = "Generating novel 3D houses from room graphs: a floorplan diffusion model followed by procedural 3D extrusion."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "shapely>=2.0.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
